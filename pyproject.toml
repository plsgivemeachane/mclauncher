[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mclauncher"
dynamic = ["version"]
description = "Minecraft offline-session launcher"
requires-python = ">=3.11"
dependencies = ["PySide6==6.12.0", "minecraft-launcher-lib==8.0"]

[project.scripts]
mclauncher = "mclauncher.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "mclauncher.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
