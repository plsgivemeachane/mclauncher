name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install application and test runner
        run: python -m pip install -c packaging/constraints.txt '.[mcp]' pytest
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run regression tests
        run: python -m pytest -q
      - name: Check packaging scripts
        run: sh -n packaging/build-deb.sh packaging/stage-minecraft-launcher-lib-metadata.sh
