name: CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install application and test runner
        run: python -m pip install -c packaging/constraints.txt . pytest
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run regression tests
        run: python -m pytest -q
      - name: Check packaging scripts
        run: sh -n packaging/build-deb.sh packaging/stage-minecraft-launcher-lib-metadata.sh

  version:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check for an unpublished version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(PYTHONPATH=src python3 -c 'from mclauncher import __version__; print(__version__)')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable X.Y.Z version'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # API failures must fail the job, rather than masquerade as a missing release.
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if grep -Fxq "v$version" <<< "$releases"; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists; tests passed and no package is needed."
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates dpkg-dev file patchelf python3 python3-venv python3-dev \
            build-essential libgl1 libegl1 libglib2.0-0 libfontconfig1 libdbus-1-3 \
            libx11-6 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libgbm1 libbrotli1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-util1 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-xinerama0 \
            libxcb-xkb1 libkrb5-3 libgssapi-krb5-2
      - name: Build Ubuntu 24.04 amd64 package
        run: SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) sh packaging/build-deb.sh
      - name: Verify package version and generate checksum
        run: |
          test "$(dpkg-deb -f "dist/mclauncher_${VERSION}_amd64.deb" Version)" = "$VERSION"
          test "$(dpkg-deb -f "dist/mclauncher_${VERSION}_amd64.deb" Architecture)" = amd64
          cd dist
          sha256sum "mclauncher_${VERSION}_amd64.deb" > SHA256SUMS
      - name: Preserve build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mclauncher-${{ env.VERSION }}-ubuntu-24.04-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "dist/mclauncher_${VERSION}_amd64.deb" dist/SHA256SUMS \
            dist/package-info.txt dist/package-contents.txt \
            --target "$GITHUB_SHA" --title "mclauncher $VERSION" --generate-notes
